<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" width="960" height="392" role="img">
<title>Money model</title>
<desc>Income, expenses and contributions flow into the balance (income minus expenses minus contributions). Contributions also fund the saving goal. The monthly budget has three states: ok below 80 percent, warning from 80 percent, over above 100 percent.</desc>
<style>
text{font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{fill:#1C1C1E}.m{fill:#6E6E73}
.h{font-size:18px;font-weight:700}.l{font-size:14px;font-weight:600}.p{font-size:13px;font-weight:700}.c{font-size:12px;font-weight:400}
.node{fill:#FFFFFF;stroke:#D8D6E3;stroke-width:1.5}
.ext{stroke-dasharray:5 4}
.panel{fill:#F3F2F9}
.acc{fill:#008D85}.mk{fill:#008D85}.on-acc{fill:#FFFFFF}
.warn{fill:#FF9500}.crit{fill:#FF3B30}
.tangerine{fill:#F98619}.sun{fill:#F9C01B}.bubble{fill:#E8A3C0}.blue{fill:#154FA3}
.ln{fill:none;stroke:#008D85;stroke-width:2}
.lncrit{fill:none;stroke:#FF3B30;stroke-width:2}
.mkc{fill:#FF3B30}
.dash{stroke-dasharray:6 4}
.on-dark{fill:#FFFFFF}.on-light{fill:#1C1C1E}
@media (prefers-color-scheme:dark){
.t{fill:#F2F2F7}.m{fill:#A1A1A6}
.node{fill:#1C1C1E;stroke:#3A3A3C}
.panel{fill:#2C2C2E}
.acc,.mk{fill:#60D6C8}.on-acc{fill:#00332F}
.warn{fill:#FF9F0A}.crit,.mkc{fill:#FF453A}
.ln{stroke:#60D6C8}.lncrit{stroke:#FF453A}
}
</style>
<defs>
<marker id="ar" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="arc" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path class="mkc" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<text x="20" y="32" class="h t">Money model</text>

<rect class="acc" x="30" y="124" width="200" height="52" rx="12"/>
<text class="l on-acc" x="130" y="155" text-anchor="middle">Income</text>
<rect class="tangerine" x="30" y="196" width="200" height="52" rx="12"/>
<text class="l on-light" x="130" y="227" text-anchor="middle">Expenses</text>
<rect class="blue" x="30" y="52" width="200" height="52" rx="12"/>
<text class="l on-dark" x="130" y="83" text-anchor="middle">Contributions</text>

<rect class="node" x="400" y="110" width="240" height="100" rx="12"/>
<text class="h t" x="520" y="150" text-anchor="middle">Balance</text>
<text class="c m" x="520" y="174" text-anchor="middle">income − expenses − contributions</text>

<rect class="node" x="740" y="44" width="190" height="56" rx="12"/>
<text class="l t" x="835" y="68" text-anchor="middle">Saving goal</text>
<text class="c m" x="835" y="86" text-anchor="middle">target + date</text>

<path class="ln" d="M230 92 C320 92 310 135 398 135" marker-end="url(#ar)"/>
<path class="ln" d="M230 150 C310 150 320 160 398 160" marker-end="url(#ar)"/>
<path class="ln" d="M230 222 C320 222 310 185 398 185" marker-end="url(#ar)"/>
<path class="ln" d="M230 72 H738" marker-end="url(#ar)"/>
<text class="c m" x="484" y="64" text-anchor="middle">progress = Σ contributions</text>

<path class="ln" d="M130 248 V260" marker-end="url(#ar)"/>
<rect class="panel" x="30" y="262" width="440" height="84" rx="20"/>
<text class="l t" x="46" y="284">Monthly budget</text>
<clipPath id="barclip"><rect x="46" y="294" width="408" height="24" rx="12"/></clipPath>
<g clip-path="url(#barclip)">
<rect class="acc" x="46" y="294" width="136" height="24"/>
<rect class="warn" x="182" y="294" width="136" height="24"/>
<rect class="crit" x="318" y="294" width="136" height="24"/>
</g>
<text class="c on-acc" style="font-weight:600" x="114" y="310" text-anchor="middle">ok &lt; 80 %</text>
<text class="c on-light" style="font-weight:600" x="250" y="310" text-anchor="middle">warning ≥ 80 %</text>
<text class="c on-dark" style="font-weight:600" x="386" y="310" text-anchor="middle">over &gt; 100 %</text>
<text class="c m" x="46" y="336">one alert per level per month</text>

<text class="c m" x="20" y="376">Periods: week · month · year, compared with the previous period at the same day</text>
</svg>
