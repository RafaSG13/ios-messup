name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  test:
    name: Test and coverage
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Pick an iPhone simulator
        run: |
          id=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | test("iOS-27")) | .value[]
             | select(.name | startswith("iPhone"))][0].udid')
          test -n "$id" && test "$id" != null
          echo "SIMULATOR_ID=$id" >> "$GITHUB_ENV"
      - name: Build the design system package
        working-directory: MUDesignSystem
        run: xcodebuild -scheme MUDesignSystem -destination 'generic/platform=iOS Simulator' build
      - name: Test
        run: |
          set -o pipefail
          xcodebuild -project iOSMessup.xcodeproj -scheme iOSMessupTests \
            -destination "id=$SIMULATOR_ID" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            test | tail -n 60
      - name: Coverage report
        if: ${{ !cancelled() }}
        run: |
          test -d TestResults.xcresult || exit 0
          xcrun xccov view --report --only-targets TestResults.xcresult > coverage.txt
          {
            echo '### Code coverage'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          xcrun xccov view --report --json TestResults.xcresult > coverage.json
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            coverage.txt
            coverage.json
          if-no-files-found: ignore
          retention-days: 14
